{{define "pokedex"}}
{{template "header" "Pokedex"}}
    <h1>Pokedex :</h1>
    <div>
        <ul class="all-buton-sommaire">
            {{range (slice . 1)}}
            <li>
                {{.Name.Fr}}
                <a href="/pokemon/{{.PokedexId}}" class="pokemon-list"><img class="img-pokemon" src="{{.Sprites.Regular}}" alt="{{.Name.Fr}}"> </a>
            </li>
            {{end}}
        </ul>
    </div>
{{template "footer"}}
{{end}}
